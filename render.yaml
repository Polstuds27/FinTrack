services:
  - type: web
    name: fintrack-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements/base.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application & python manage.py qcluster
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      # EmailJS - HTTPS email delivery (Render blocks outbound SMTP).
      # Leave blank to log emails to the server console instead.
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
